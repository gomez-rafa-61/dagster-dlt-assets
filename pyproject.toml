[project]
name = "data-pipelines-workspace"
version = "0.1.0"
description = "Dagster-orchestrated dlt pipelines (SharePoint, future sources) → Snowflake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dlt[snowflake,workspace]>=1.24.0",
    "dagster>=1.13.0",
    "dagster-webserver>=1.9.0",
    "dagster-dlt>=0.25.0",
    "pymssql>=2.2.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipelines"]

[tool.hatch.build.targets.sdist]
include = ["data_pipelines", "pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["data_pipelines", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.dagster]
module_name = "data_pipelines.definitions"
code_location_name = "data_pipelines"
